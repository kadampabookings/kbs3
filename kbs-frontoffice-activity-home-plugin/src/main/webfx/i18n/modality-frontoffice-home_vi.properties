PodcastsCard1Title=Sống hạnh phúc hơn
PodcastsCard1Content=Nơi chúng ta khám phá nghệ thuật sống một cuộc sống hạnh phúc và viên mãn hơn thông qua các giáo lý và thiền của Phật giáo Kadampa.
PodcastsCard2Title=Trí tuệ cổ xưa
PodcastsCard2Content=Các nguyên lý của Phật giáo có thể được áp dụng vào thế giới hiện đại của chúng ta để giúp chúng ta vượt qua những thử thách của cuộc sống hàng ngày một cách dễ dàng và đầy lòng từ bi hơn.
PodcastsCard3Content=Khám phá các khái niệm cốt lõi của thiền Phật giáo, như chánh niệm, lòng từ bi và trí tuệ.
PodcastsCard3Title=Thiền
PodcastsCard4Content=Mỗi tập podcast truyền cảm hứng cho chúng ta nuôi dưỡng một cảm giác bình an, sự sáng suốt và hạnh phúc lớn hơn trong cuộc sống hàng ngày.
PodcastsCard4Title=Cảm hứng
PodcastsCard5Content=Một hành trình khám phá bản thân và biến đổi khi chúng ta tìm hiểu về trí tuệ bất diệt của Phật giáo và cách nó có thể được áp dụng.
PodcastsCard5Title=Khám phá bản thân
PodcastsCard6Content=Các cuộc trò chuyện đầy cảm hứng khám phá cách tất cả chúng ta có thể sử dụng thiền và trí tuệ bất diệt của Đức Phật để tìm thấy bình an nội tâm sâu sắc hơn.
