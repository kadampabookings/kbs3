# Security watch: the server's daily check of the third-party layers it runs against public sources, read by platform
# super administrators on a back-office page (kbs-server-securitywatch-plugin).
#
# enabled: whether this server runs the check at all. Only `true` (any case) turns it on; unset, anything else, and a
# configuration that never loaded all mean OFF, and the boot log says which state the server is in. OFF means the
# server NEVER calls out to any source: the page still opens, says the check is switched off on this server, and shows
# whatever report is stored (usually none). "Check now" is refused with SecurityWatchDisabledError.
#
# directory: where the check reads the deployment's inventory and front-end lockfile from (inventory.json,
# package-lock.json). Nothing is ever written there.
#
# HOW TO SET THEM. Declared WITH a default, like the mailer's switch, so the check can never be accidentally on:
#   * the process environment: SECURITY_WATCH_ENABLED=true and SECURITY_WATCH_DIR=/path/to/a/folder (local development,
#     e.g. an IntelliJ run configuration), or
#   * a conf-directory override: `enabled = true` in conf/override@kbs.server.securitywatch.properties - how a deployment
#     bakes it into its image, filled at build time from its own variables.
# NOT through a variables file (public-variables.properties): a `${{ VAR | default }}` placeholder is substituted when
# the bundled config is first parsed, before the conf-directory variables files load, so the default would silently
# win (see declare@webfx.stack.session.token.properties). That failure is the safe one - the check stays off - but it
# would look like a switch that does not work.
#
# AND: a declare@ file in a module is only read once `webfx update` has merged it into the server application's
# GENERATED src-root.json. Missing, the check reads as off and the boot log says the section is missing.
enabled = ${{ SECURITY_WATCH_ENABLED | false }}
directory = ${{ SECURITY_WATCH_DIR | '/opt/kbs/security-watch' }}
