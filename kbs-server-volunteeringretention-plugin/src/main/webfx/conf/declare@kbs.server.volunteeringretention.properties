# The volunteering GDPR retention job: calls volunteering_retention_sweep() (migration
# V0074) on a schedule and deletes due applicant photographs from the image store.
# DISABLED by default, and even enabled it stays in DRY-RUN (counts only, no data change)
# until dryRun is explicitly false — the retention periods are a DPO ruling, not a
# developer default. Local testing additionally requires enabledInDevelopment = true.
enabled = ${{ VOLUNTEERING_RETENTION_ENABLED | false }}
enabledInDevelopment = ${{ VOLUNTEERING_RETENTION_ENABLED_IN_DEVELOPMENT | false }}
dryRun = ${{ VOLUNTEERING_RETENTION_DRY_RUN | true }}

# CDN deletion is gated separately: the Bunny storage zone is shared infrastructure, so
# only the environment whose database is authoritative for the zone (production) may
# delete objects from it. A staging server sweeping its own data copy must never remove
# pictures the production rows still reference.
cdnDeleteEnabled = ${{ VOLUNTEERING_RETENTION_CDN_DELETE_ENABLED | false }}

# Schedule and write bounds. Each run is idempotent; the batch limits only spread a
# large backlog over successive runs.
runPeriodHours = ${{ VOLUNTEERING_RETENTION_RUN_PERIOD_HOURS | 24 }}
batchLimit = ${{ VOLUNTEERING_RETENTION_BATCH_LIMIT | 500 }}
photoBatchLimit = ${{ VOLUNTEERING_RETENTION_PHOTO_BATCH_LIMIT | 50 }}

# Retention periods (proposed defaults, to be ratified by the DPO — see
# docs/operations/volunteering-retention.md). Grace/expiry rules in days, the
# stage periods in months from each application's retention anchor.
tokenGraceDays = ${{ VOLUNTEERING_RETENTION_TOKEN_GRACE_DAYS | 30 }}
shareCodeMaxAgeDays = ${{ VOLUNTEERING_RETENTION_SHARE_CODE_MAX_AGE_DAYS | 90 }}
stage1Months = ${{ VOLUNTEERING_RETENTION_STAGE1_MONTHS | 3 }}
specialNeedsMonths = ${{ VOLUNTEERING_RETENTION_SPECIAL_NEEDS_MONTHS | 3 }}
stage2NeverServedMonths = ${{ VOLUNTEERING_RETENTION_STAGE2_NEVER_SERVED_MONTHS | 12 }}
stage2ServedMonths = ${{ VOLUNTEERING_RETENTION_STAGE2_SERVED_MONTHS | 24 }}
